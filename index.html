<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WORKNIC STORE</title>

<style>
body{
font-family: Arial;
background:#111;
color:white;
text-align:center;
padding:40px;
}

input{
width:300px;
padding:12px;
font-size:18px;
}

button{
padding:12px 20px;
font-size:18px;
background:#E2725B;
color:white;
border:none;
cursor:pointer;
}

.result{
margin-top:30px;
font-size:20px;
}
</style>

</head>

<body>

<h1>WORKNIC STORE SEARCH</h1>

<input id="search" placeholder="제품명 검색">
<br><br>

<button onclick="searchProduct()">검색</button>

<div class="result" id="result"></div>

<script>

let products = [
{name:"타지마 수평기",price:"32,000원"},
{name:"마끼다 드릴",price:"185,000원"},
{name:"PVC 파이프",price:"3,000원"}
]

function searchProduct(){

let keyword = document.getElementById("search").value

let result = products.find(p=>p.name.includes(keyword))

if(result){

document.getElementById("result").innerHTML=
result.name+"<br>"+result.price

}else{

document.getElementById("result").innerHTML=
"제품을 찾을 수 없습니다."

}

}

</script>

</body>
</html>
