<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>가족 생활 점수표</title>

<style>

body{
font-family:Arial;
background:#f3f3f3;
text-align:center;
padding:30px;
}

h1{
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
margin:15px auto;
max-width:400px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
padding:10px 16px;
margin:5px;
border:none;
border-radius:8px;
background:black;
color:white;
font-size:14px;
}

.score{
font-size:28px;
font-weight:bold;
margin:10px;
}

</style>

</head>

<body>

<h1>가족 생활 점수표</h1>


<div class="card">

<h2>하준</h2>

<div class="score" id="s1">0</div>

<button onclick="add(1,5)">루틴</button>
<button onclick="add(1,3)">아침준비</button>
<button onclick="add(1,3)">독서</button>
<button onclick="add(1,4)">학습</button>
<button onclick="add(1,3)">정리</button>
<button onclick="add(1,3)">부모님 도움</button>
<button onclick="add(1,4)">형제관계</button>

</div>


<div class="card">

<h2>하니</h2>

<div class="score" id="s2">0</div>

<button onclick="add(2,5)">루틴</button>
<button onclick="add(2,3)">아침준비</button>
<button onclick="add(2,3)">독서</button>
<button onclick="add(2,4)">학습</button>
<button onclick="add(2,3)">정리</button>
<button onclick="add(2,3)">부모님 도움</button>
<button onclick="add(2,4)">형제관계</button>

</div>


<div class="card">

<h2>예니</h2>

<div class="score" id="s3">0</div>

<button onclick="add(3,5)">루틴</button>
<button onclick="add(3,3)">아침준비</button>
<button onclick="add(3,3)">독서</button>
<button onclick="add(3,4)">학습</button>
<button onclick="add(3,3)">정리</button>
<button onclick="add(3,3)">부모님 도움</button>
<button onclick="add(3,4)">형제관계</button>

</div>



<script>

let score=[0,0,0,0]

function add(i,p){

score[i]+=p

document.getElementById("s"+i).innerText=score[i]

}

</script>

</body>
</html>
